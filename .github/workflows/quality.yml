name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request makes the older run's results moot: stop it. Runs on main
# are never cancelled.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No job builds the desktop shell, so none needs the Electron binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    # Decides which of the slow jobs below a change needs (tools/ci-scope.mjs): documentation and
    # interface changes skip the engine suites, and anything it cannot read runs everything.
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
      app: ${{ steps.scope.outputs.app }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: scope
        run: node tools/ci-scope.mjs

  format:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

  lint:
    name: Lint (ESLint and dependency rules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint and the dependency-rule check
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript checks
        run: pnpm typecheck

  test-simulation:
    name: Simulation tests
    runs-on: ubuntu-latest
    needs: changes
    # Only for a change that can affect the engine; the aggregate `test` job knows that a skip is fine.
    if: needs.changes.outputs.engine == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the simulation's fast suite
        run: pnpm --filter @sovereign/simulation test

  test-packages:
    name: Package and tool tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tool tests and every package's tests except the simulation's
        run: pnpm test:tools && pnpm -r --filter '!@sovereign/simulation' test

  test:
    name: Unit and integration tests
    # The one check that stands for all the test jobs above, so it passes exactly when everything
    # that had to run passed.
    needs: [changes, test-simulation, test-packages]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every test job that had to run
        env:
          CHANGES: ${{ needs.changes.result }}
          PACKAGES: ${{ needs.test-packages.result }}
          SIMULATION: ${{ needs.test-simulation.result }}
          ENGINE: ${{ needs.changes.outputs.engine }}
        run: |
          echo "changes=$CHANGES packages=$PACKAGES simulation=$SIMULATION engine=$ENGINE"
          test "$CHANGES" = success
          test "$PACKAGES" = success
          if [ "$ENGINE" = true ]; then test "$SIMULATION" = success; fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - typecheck
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

  determinism:
    name: Determinism (${{ matrix.os }}, ${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ${{ matrix.os }}
    # Required: a failure means the engine has diverged from its golden hashes, or between
    # operating systems, and that is the one thing this project cannot ship.

    # The suite is cut into shards named by file; tools/determinism-shards.test.mjs holds the lists
    # to the directory, so a new test file cannot be left out. `pnpm test:determinism` runs them all.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard:
          - name: world goldens
            files: tests/determinism/golden.test.ts tests/determinism/biome-coverage.test.ts
          - name: terrain and math goldens
            files: tests/determinism/terrain-golden.test.ts tests/determinism/transcendental-golden.test.ts tests/determinism/resource-coverage.test.ts

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run this shard of the determinism suite
        run: pnpm --filter @sovereign/simulation exec vitest run --config vitest.determinism.config.ts ${{ matrix.shard.files }}

  pages:
    name: Pages artifact
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # The deploy workflow only runs on main, so this builds the same artifact on every pull request
    # and checks that it is deployable (relative URLs, nothing missing).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @sovereign/web build

      - name: Check the artifact
        run: node tools/check-pages-artifact.mjs apps/web/dist

  e2e:
    name: Browser end-to-end
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # The development build runs React.StrictMode, which mounts everything twice; this drives a
    # real Chromium through that and the first world, with a mouse and then with touch (apps/web/e2e).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @sovereign/web exec playwright install --with-deps chromium

      - name: Run the end-to-end test
        run: pnpm --filter @sovereign/web e2e

      - name: Run the mobile (touch) end-to-end test
        run: pnpm --filter @sovereign/web e2e:mobile
