# Build and release the desktop app (apps/desktop). Not run by pull requests: it fires when a
# release is published, or by hand.
name: Build & Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            flag: --win
            artifacts: |
              apps/desktop/release/*.exe
          - name: Linux
            os: ubuntu-latest
            flag: --linux
            artifacts: |
              apps/desktop/release/*.AppImage
          - name: macOS
            os: macos-latest
            flag: --mac
            artifacts: |
              apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @sovereign/web build

      - name: Build the desktop shell
        run: pnpm --filter @sovereign/desktop build

      - name: Package the desktop app
        run: pnpm --filter @sovereign/desktop exec electron-builder ${{ matrix.flag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-release
          path: ${{ matrix.artifacts }}
          retention-days: 30

      - name: Upload to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
