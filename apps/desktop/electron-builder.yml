# Packaging config for the desktop shell: `pnpm --filter @sovereign/desktop package`.
# The web build is shipped next to the app as resources/web (see src/paths.ts).
appId: com.codebybryant.sovereign
productName: Sovereign
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web
win:
  target: nsis
  executableName: sovereign
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.simulation-games
  target: dmg
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target: AppImage
  category: Game
  executableName: sovereign
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
